<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Scrapix</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0d9488;--accent-text:#fff;--err:#b91c1c;--errbg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--text:#e5e7eb;--muted:#94a3b8;--line:#1f2a44;--accent:#2dd4bf;--accent-text:#04201c;--err:#fecaca;--errbg:#450a0a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
h1{font-size:1.4rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-text);font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);width:auto;margin:0;padding:8px 12px;font-weight:500}
progress{width:100%;height:10px}
.muted{color:var(--muted);font-size:.9rem}
.title{font-weight:600;word-break:break-word}
.err{background:var(--errbg);color:var(--err);padding:10px 12px;border-radius:10px;margin-top:10px;word-break:break-word}
a.file{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--accent);word-break:break-all}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>Scrapix</h1>
    <button id="install" class="btn ghost" type="button" hidden>Install app</button>
  </header>

  <section class="card">
    <h2>1. Dari mana?</h2>
    <div id="sites" class="chips"></div>
  </section>

  <section class="card" id="kindCard" hidden>
    <h2>2. Download apa?</h2>
    <div id="kinds" class="chips"></div>
  </section>

  <section class="card" id="linkCard" hidden>
    <h2>3. Link</h2>
    <input id="url" type="url" inputmode="url" placeholder="Tempel link di sini" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="check" class="btn" type="button">Cek link</button>
  </section>

  <section class="card" id="qualCard" hidden>
    <h2>4. Kualitas</h2>
    <div id="info"></div>
    <div id="heightWrap">
      <label for="height">Kualitas video</label>
      <select id="height"></select>
    </div>
    <label for="abr">Kualitas audio</label>
    <select id="abr"></select>
    <button id="go" class="btn" type="button">Download</button>
  </section>

  <section class="card" id="progCard" hidden>
    <h2>Progres</h2>
    <progress id="bar" max="100"></progress>
    <div id="progText" class="muted"></div>
    <div id="files"></div>
  </section>

  <div id="error" class="err" hidden></div>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const KIND = { video: "Video penuh", audio: "Audio saja (MP3)", image: "Gambar / foto" };
  const st = { cfg: null, site: null, kind: null, url: "" };

  async function api(path, body) {
    const opts = body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : undefined;
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Error " + res.status);
    return data;
  }

  function showError(msg) {
    const el = $("#error");
    el.textContent = msg || "";
    el.hidden = !msg;
  }

  function chips(el, items, selected, onPick) {
    el.replaceChildren(
      ...items.map(([value, label]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (value === selected ? " on" : "");
        b.textContent = label;
        b.onclick = () => onPick(value);
        return b;
      })
    );
  }

  function fillSelect(el, options) {
    el.replaceChildren(
      ...options.map(([value, label]) => {
        const o = document.createElement("option");
        o.value = value;
        o.textContent = label;
        return o;
      })
    );
  }

  function fmtBytes(n) {
    if (!n) return "0 B";
    const u = ["B", "KB", "MB", "GB"];
    const i = Math.min(Math.floor(Math.log(n) / Math.log(1024)), u.length - 1);
    return (n / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i];
  }

  function fmtDuration(s) {
    if (!s) return "?";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.floor(s % 60);
    const p = (v) => String(v).padStart(2, "0");
    return h ? h + ":" + p(m) + ":" + p(x) : m + ":" + p(x);
  }

  function resetFrom(step) {
    if (step <= 2) $("#kindCard").hidden = true;
    if (step <= 3) $("#linkCard").hidden = true;
    $("#qualCard").hidden = true;
    $("#progCard").hidden = true;
    showError("");
  }

  function renderSites() {
    chips($("#sites"), st.cfg.sites.map((s) => [s.key, s.label]), st.site && st.site.key, (key) => {
      st.site = st.cfg.sites.find((s) => s.key === key);
      st.kind = null;
      resetFrom(3);
      renderSites();
      renderKinds();
      $("#kindCard").hidden = false;
    });
  }

  function renderKinds() {
    chips($("#kinds"), st.site.kinds.map((k) => [k, KIND[k]]), st.kind, (kind) => {
      st.kind = kind;
      resetFrom(4);
      renderKinds();
      $("#check").textContent = kind === "image" ? "Download" : "Cek link";
      $("#linkCard").hidden = false;
    });
  }

  async function checkLink() {
    showError("");
    const url = $("#url").value.trim();
    if (!url) return showError("Tempel link dulu.");
    st.url = url;
    if (st.kind === "image") return startDownload(null, null);

    const btn = $("#check");
    btn.disabled = true;
    btn.textContent = "Mengecek...";
    $("#qualCard").hidden = true;
    try {
      renderQuality(await api("/api/probe", { url }));
    } catch (e) {
      showError(e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Cek link";
    }
  }

  function renderQuality(info) {
    const box = $("#info");
    box.replaceChildren();
    const t = document.createElement("div");
    t.className = "title";
    t.textContent = info.title;
    const m = document.createElement("div");
    m.className = "muted";
    m.textContent = (info.uploader || "-") + "  |  " + fmtDuration(info.duration);
    box.append(t, m);

    const isVideo = st.kind === "video";
    $("#heightWrap").hidden = !(isVideo && info.heights.length);
    fillSelect($("#height"), [["0", "Terbaik"], ...info.heights.map((h) => [String(h), h + "p"])]);

    const rates = isVideo ? st.cfg.video_audio_bitrates : st.cfg.audio_bitrates;
    fillSelect($("#abr"), [...(isVideo ? [["0", "Terbaik"]] : []), ...rates.map((r) => [String(r), r + " kbps"])]);
    $("#qualCard").hidden = false;
  }

  async function startDownload(height, abr) {
    showError("");
    $("#go").disabled = true;
    $("#check").disabled = true;
    $("#progCard").hidden = false;
    $("#files").replaceChildren();
    $("#progText").textContent = "Memulai...";
    $("#bar").removeAttribute("value");
    try {
      const { id } = await api("/api/download", { url: st.url, kind: st.kind, height, abr });
      await poll(id);
    } catch (e) {
      showError(e.message);
      $("#progCard").hidden = true;
    } finally {
      $("#go").disabled = false;
      $("#check").disabled = false;
    }
  }

  async function poll(id) {
    for (;;) {
      let job;
      try {
        job = await api("/api/jobs/" + id);
      } catch (e) {
        throw new Error("Server Scrapix tidak merespons. Masih jalan?");
      }
      renderJob(id, job);
      if (job.status === "done" || job.status === "error") return;
      await new Promise((r) => setTimeout(r, 700));
    }
  }

  function renderJob(id, job) {
    const bar = $("#bar"), txt = $("#progText");
    if (job.status === "queued") txt.textContent = "Antre...";
    if (job.status === "running") {
      if (job.total) {
        bar.max = job.total;
        bar.value = job.done;
        txt.textContent = "Mengunduh... " + fmtBytes(job.done) + " / " + fmtBytes(job.total);
      } else {
        bar.removeAttribute("value");
        txt.textContent = "Mengunduh... " + fmtBytes(job.done);
      }
    }
    if (job.status === "error") {
      $("#progCard").hidden = true;
      showError(job.message || "Gagal.");
    }
    if (job.status === "done") {
      bar.max = 1;
      bar.value = 1;
      txt.textContent = job.files.length ? "Selesai. Sudah tersimpan di folder Scrapix." : "Selesai.";
      $("#files").replaceChildren(
        ...job.files.map((f, i) => {
          const a = document.createElement("a");
          a.className = "file";
          a.href = "/api/jobs/" + id + "/files/" + i;
          a.download = f.name;
          a.textContent = f.name + " (" + fmtBytes(f.size) + ")";
          return a;
        })
      );
    }
  }

  $("#check").onclick = checkLink;
  $("#url").addEventListener("keydown", (e) => { if (e.key === "Enter") checkLink(); });
  $("#go").onclick = () => {
    const h = parseInt($("#height").value, 10) || null;
    const a = parseInt($("#abr").value, 10) || null;
    startDownload(h, a);
  };

  let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstall = e;
    $("#install").hidden = false;
  });
  $("#install").onclick = async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    $("#install").hidden = true;
  };

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

  api("/api/config")
    .then((cfg) => { st.cfg = cfg; renderSites(); })
    .catch(() => showError("Tidak bisa konek ke server Scrapix."));
})();
</script>
</body>
</html>
