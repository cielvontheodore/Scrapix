[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapix"
version = "0.1.0"
description = "TUI downloader for YouTube, Instagram and TikTok (wraps yt-dlp and gallery-dl)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "gallery-dl>=1.26",
    "questionary>=2.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scrapix = "scrapix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapix"]
